name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Optional private release key (for Google Play). Without these secrets the
      # public sideload key from the repository is used, so updates still install in place.
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AETHERFALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AETHERFALL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          AETHERFALL_KEYSTORE_PASSWORD: ${{ secrets.AETHERFALL_KEYSTORE_PASSWORD }}
          AETHERFALL_KEY_ALIAS: ${{ secrets.AETHERFALL_KEY_ALIAS }}
          AETHERFALL_KEY_PASSWORD: ${{ secrets.AETHERFALL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "out/Aetherfall-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk out/Aetherfall.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-APK
          path: out/Aetherfall-*.apk
          retention-days: 30

      # Rolling pre-release with the newest build of this branch: one stable download link.
      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          TAG="latest-${BRANCH}"
          NOTES="Сборка ${VERSION} (build ${{ github.run_number }}) из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}. Скачайте Aetherfall.apk и установите на Android."
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Aetherfall ${VERSION} — свежая сборка (${GITHUB_REF_NAME})" --notes "$NOTES" --prerelease
            gh release upload "$TAG" out/Aetherfall.apk --clobber
          else
            gh release create "$TAG" out/Aetherfall.apk --title "Aetherfall ${VERSION} — свежая сборка (${GITHUB_REF_NAME})" --notes "$NOTES" --prerelease
          fi
